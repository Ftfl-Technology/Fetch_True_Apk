dependencies:
  flutter:
    sdk: flutter

  # UI Widgets
  lottie:
  flutter_staggered_grid_view: ^0.7.0
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.0.0
  syncfusion_flutter_charts: ^31.1.18
  dotted_border:
  scratcher: ^2.5.0
  shimmer: ^3.0.0
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  youtube_player_flutter: ^9.1.1
  auto_size_text: ^3.0.0
  font_awesome_flutter: ^10.12.0



#  State Management & Utilities
  flutter_bloc: ^9.1.0
  provider: ^6.1.5
  equatable: ^2.0.7
  intl: ^0.20.2
  go_router: ^17.0.0

#  Device Information & System Utilities
  package_info_plus: ^9.0.0
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  flutter_email_sender: ^8.0.0
  fluttertoast: ^8.2.12
  url_launcher: ^6.3.1
  pinput: ^6.0.2
  google_sign_in: ^7.2.0
  collection: ^1.18.0

# Map
  geolocator: ^14.0.2
  geocoding: ^4.0.0


