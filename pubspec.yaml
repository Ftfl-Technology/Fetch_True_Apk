  video_player: ^2.8.2
  india_state_city_picker: ^0.0.3
  flutter_image_compress: ^2.4.0

  # Networking & Web
  dio: ^5.8.0+1
  flutter_inappwebview: ^6.1.5
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^3.0.1
  # http: ^1.4.0   # remove if not needed


  # Firebase Services
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.1
#  firebase_messaging: ^16.1.1
#  flutter_local_notifications: ^20.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/fetch_true_icon.jpg"
  min_sdk_android: 23


flutter:
  uses-material-design: true

  assets:
    - assets/auth/
    - assets/image/
    - assets/icon/
    - assets/package/
    - assets/lead/
    - assets/lottie/
    - assets/marketing/
    - assets/category/legal/
    - assets/category/finance/
    - assets/category/ai/
